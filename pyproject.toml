[project]
name = "fuel-route-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fuelroute.test_settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["routing/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]
